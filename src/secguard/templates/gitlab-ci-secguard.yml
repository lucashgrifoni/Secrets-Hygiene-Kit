# secguard GitLab CI starter
#
# secguard writes an includable snippet instead of overwriting `.gitlab-ci.yml`.
# Add this to your pipeline:
#
#   include:
#     - local: '.gitlab/secguard.gitlab-ci.yml'

# Install the GitHub release revision reviewed by your team. The image needs
# Git; dependencies still come from the configured Python package index.
.secguard_base:
  image: python:3.12
  before_script:
    - python -m pip install --no-cache-dir "git+https://github.com/lucashgrifoni/secrets-hygiene-kit@v0.4.0"

secguard:waivers:
  extends: .secguard_base
  stage: test
  script:
    - secguard waivers check --file .secguard/waivers.yaml
    - secguard playbooks check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

secguard:gate:
  extends: .secguard_base
  stage: test
  # Detection runs in a job your team controls and pins. Have it publish
  # gitleaks.json, trufflehog.jsonl, or .secrets.baseline as an artifact, then
  # let this job consume the report and decide block or pass.
  # Keep scan errors fatal: use gitleaks --exit-code 0 or TruffleHog
  # --fail-on-scan-errors, without suppressing the detector's exit status.
  needs:
    - job: secrets:detect
      artifacts: true
      optional: true
  script:
    - |
      args=""
      for report in gitleaks.json trufflehog.jsonl .secrets.baseline; do
        if [ -f "$report" ]; then
          args="$args --input $report"
        fi
      done
      if [ -z "$args" ]; then
        # Passing here would make a pipeline whose detect job never ran
        # indistinguishable from a repository with no secrets.
        echo "no scanner report found, so nothing was gated." >&2
        echo "Have secrets:detect publish gitleaks.json, trufflehog.jsonl," >&2
        echo "or .secrets.baseline as an artifact this job can consume." >&2
        exit 1
      fi
      secguard scan check $args \
        --waivers .secguard/waivers.yaml \
        --fail-on high \
        --sarif secguard.sarif \
        --markdown secguard-report.md
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - secguard.sarif
      - secguard-report.md
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
