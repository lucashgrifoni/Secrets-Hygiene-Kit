name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest

  self-check:
    name: secguard checks itself
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: python -m pip install .

      # The playbook review window is a promise this repository has to keep
      # first. If secguard's own guidance goes stale, the build says so.
      - name: Check playbook freshness
        run: secguard playbooks check

      - name: Check waiver lifecycle
        if: hashFiles('.secguard/waivers.yaml') != ''
        run: secguard waivers check --file .secguard/waivers.yaml

      - name: Gate the redacted fixtures
        run: |
          secguard scan check \
            --input tests/fixtures/gitleaks-report.json \
            --input tests/fixtures/trufflehog-report.jsonl \
            --input tests/fixtures/detect-secrets-baseline.json \
            --fail-on none \
            --sarif secguard.sarif \
            --markdown secguard-report.md

      - name: Confirm no fixture canary reached the outputs
        run: |
          if grep -R -l "SECGUARD-CANARY" secguard.sarif secguard-report.md; then
            echo "::error title=redaction::Fixture canary leaked into secguard output"
            exit 1
          fi
          echo "outputs are clean"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      # Packaged data is easy to break and invisible until a user installs the
      # wheel, so install from the artifact and exercise the packaged resources.
      - name: Verify packaged resources survive the wheel
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/secguard playbooks list
          /tmp/verify/bin/secguard incident start --secret-type gcp-service-account-json > /dev/null
          /tmp/verify/bin/secguard init /tmp/scaffold-check --ci both

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
