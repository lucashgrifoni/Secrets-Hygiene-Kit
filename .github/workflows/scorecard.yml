name: OpenSSF Scorecard

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate repository posture without publication credentials
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: Preserve full posture report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-json
          path: scorecard.json
          if-no-files-found: error
          retention-days: 14
  policy:
    name: Scorecard policy
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download same-run posture report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-json
          path: reports
      - name: Enforce documented repository controls
        run: python3 scripts/check_security_reports.py scorecard reports/scorecard.json
  publish:
    name: Publish Scorecard
    needs: analyze
    if: >-
      github.event_name == 'branch_protection_rule' ||
      github.event_name == 'schedule' ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish authenticated Scorecard results
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Preserve published report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Upload Scorecard
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
  scorecard-checks:
    name: Scorecard checks
    if: always()
    needs: [analyze, policy, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require posture policy and applicable publication to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          if any(results[job]["result"] != "success" for job in ("analyze", "policy")):
              raise SystemExit("Scorecard analysis or policy failed")
          event = os.environ["EVENT_NAME"]
          trusted = event in ("schedule", "branch_protection_rule") or (
              os.environ["REF"] == "refs/heads/main" and event in ("push", "workflow_dispatch")
          )
          if results["publish"]["result"] != ("success" if trusted else "skipped"):
              raise SystemExit("Scorecard publication did not reach its expected state")
          print("Scorecard checks passed")
          PY
