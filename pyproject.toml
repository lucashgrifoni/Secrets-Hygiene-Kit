[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secrets-hygiene-kit"
version = "0.5.0"
description = "secguard: normalize secret-scanner reports, enforce waiver lifecycle, and run leak response playbooks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Henrique Grifoni" }]
keywords = ["security", "secrets", "appsec", "devsecops", "gitleaks", "trufflehog", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  # `build` is here because docs/adding-playbook.md tells a contributor to run
  # `python -m build` to prove a new playbook survives packaging, and the only
  # documented dev setup is this extra.
  "build>=1.2,<2",
  "pytest>=8.2,<10",
  "ruff>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/lucashgrifoni/secrets-hygiene-kit"
Documentation = "https://github.com/lucashgrifoni/secrets-hygiene-kit/blob/main/docs/quickstart.md"
Repository = "https://github.com/lucashgrifoni/secrets-hygiene-kit"
Issues = "https://github.com/lucashgrifoni/secrets-hygiene-kit/issues"
Changelog = "https://github.com/lucashgrifoni/secrets-hygiene-kit/blob/main/CHANGELOG.md"

[project.scripts]
secguard = "secguard.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secguard = [
  "py.typed",
  "data/*.yaml",
  "playbooks/*/PLAYBOOK.md",
  "templates/*.yaml",
  "templates/*.yml",
  "templates/*.rego",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
