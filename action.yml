name: "secguard secret hygiene gate"
description: >-
  Normalize gitleaks, trufflehog, and detect-secrets reports into one canonical
  finding set, apply the waiver lifecycle, and fail the build on unwaived
  findings or expired waivers. Reads reports; never runs a scanner and never
  rotates a credential.
author: "Lucas Henrique Grifoni"

branding:
  icon: "shield"
  color: "red"

inputs:
  reports:
    description: >-
      Newline-separated scanner report paths, one per line. Missing paths are
      skipped, so you can list every report your pipeline might produce, but
      the run fails if none of them exists. Paths may contain spaces; a space
      is never a separator.
    required: false
    default: |
      gitleaks.json
      trufflehog.jsonl
      .secrets.baseline
  allow-missing-reports:
    description: >-
      Report a warning instead of failing when no scanner report is present.
      Leave this false: a gate that finds no report has scanned nothing, and a
      green check that scanned nothing is worse than no check at all.
    required: false
    default: "false"
  waivers:
    description: "Path to the secguard waiver file."
    required: false
    default: ".secguard/waivers.yaml"
  fail-on:
    description: "Blocking severity threshold: none, info, low, medium, high, critical."
    required: false
    default: "high"
  rules:
    description: "Optional local rule catalog merged over the packaged catalog."
    required: false
    default: ""
  sarif-output:
    description: "Where to write the SARIF 2.1.0 log. Empty disables SARIF output."
    required: false
    default: "secguard.sarif"
  markdown-output:
    description: "Where to write the Markdown report. Empty disables it."
    required: false
    default: "secguard-report.md"
  comment-output:
    description: "Where to write the compact pull-request comment. Empty disables it."
    required: false
    default: "secguard-comment.md"
  publish-pr-comment:
    description: "Publish a counts-only PR summary after PASS or BLOCK. Requires explicit trusted-repository configuration and a write token."
    required: false
    default: "false"
  comment-repository:
    description: "Trusted owner/repository allowed to receive comments. Set a fixed literal in the workflow."
    required: false
    default: ""
  comment-marker:
    description: "Comment namespace for this gate, using lowercase letters, digits, underscores, or hyphens."
    required: false
    default: "secguard"
  comment-author:
    description: "Bot login that owns the marker comment. The API must confirm its identity."
    required: false
    default: "github-actions[bot]"
  check-playbooks:
    description: "Also fail when a packaged playbook is past its review window."
    required: false
    default: "true"
  python-version:
    description: "Python version used to install secguard."
    required: false
    default: "3.12"

outputs:
  verdict:
    description: "PASS, BLOCK, ERROR, or NO-REPORTS. ERROR means no valid gate decision was made."
    value: ${{ steps.gate.outputs.verdict || (steps.collect.outcome == 'success' && steps.collect.outputs.count == '0' && 'NO-REPORTS') || 'ERROR' }}
  reports-found:
    description: "Number of scanner reports that were actually present."
    value: ${{ steps.collect.outputs.count }}
  comment-status:
    description: "created, updated, unchanged, or not-published. Empty when publishing is disabled."
    value: ${{ steps.publish.outputs.status }}
  comment-id:
    description: "Numeric ID of the confirmed PR comment. Empty when no comment was published."
    value: ${{ steps.publish.outputs.comment-id }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # Install the caller's selected revision. Build and runtime dependencies
    # still come from the configured Python package index.
    - name: Install secguard
      shell: bash
      env:
        SECGUARD_SOURCE: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$SECGUARD_SOURCE"

    # Every input reaches the shell through the environment, never through
    # `${{ }}` interpolation into a `run:` body. Interpolation splices the value
    # into the script before bash parses it, so a workflow that passes a
    # caller-controlled string would be handing the runner a command to execute.
    - name: Check waiver lifecycle
      shell: bash
      env:
        SECGUARD_WAIVERS: ${{ inputs.waivers }}
      run: |
        if [ -f "$SECGUARD_WAIVERS" ]; then
          secguard waivers check --file "$SECGUARD_WAIVERS"
        else
          echo "no waiver file at $SECGUARD_WAIVERS; skipping the lifecycle check"
        fi

    - name: Check playbook freshness
      if: inputs.check-playbooks == 'true'
      shell: bash
      run: secguard playbooks check

    - name: Collect scanner reports
      id: collect
      shell: bash
      env:
        SECGUARD_REPORTS: ${{ inputs.reports }}
      run: |
        # One path per line. Splitting on spaces as well would shred any path
        # containing one into two nonexistent paths, and a report that silently
        # disappears is how a gate ends up scanning nothing while staying green.
        list="$RUNNER_TEMP/secguard-reports.txt"
        : > "$list"
        count=0
        while IFS= read -r report; do
          report="${report%$'\r'}"
          [ -z "$report" ] && continue
          if [ -f "$report" ]; then
            printf '%s\n' "$report" >> "$list"
            count=$((count + 1))
          else
            echo "no report at: $report"
          fi
        done <<< "$SECGUARD_REPORTS"
        echo "count=$count" >> "$GITHUB_OUTPUT"

    - name: Secret hygiene gate
      id: gate
      if: steps.collect.outputs.count != '0'
      shell: bash
      env:
        SECGUARD_WAIVERS: ${{ inputs.waivers }}
        SECGUARD_FAIL_ON: ${{ inputs.fail-on }}
        SECGUARD_RULES: ${{ inputs.rules }}
        SECGUARD_SARIF: ${{ inputs.sarif-output }}
        SECGUARD_MARKDOWN: ${{ inputs.markdown-output }}
        SECGUARD_COMMENT: ${{ inputs.comment-output }}
      run: |
        # An array, not a string: word splitting would break every path that
        # contains a space, which is the same bug one layer down.
        args=()
        while IFS= read -r report; do
          args+=(--input "$report")
        done < "$RUNNER_TEMP/secguard-reports.txt"

        if [ -n "$SECGUARD_RULES" ]; then args+=(--rules "$SECGUARD_RULES"); fi
        if [ -n "$SECGUARD_SARIF" ]; then args+=(--sarif "$SECGUARD_SARIF"); fi
        if [ -n "$SECGUARD_MARKDOWN" ]; then args+=(--markdown "$SECGUARD_MARKDOWN"); fi
        if [ -n "$SECGUARD_COMMENT" ]; then args+=(--pr-comment "$SECGUARD_COMMENT"); fi

        if secguard scan check "${args[@]}" \
          --waivers "$SECGUARD_WAIVERS" \
          --fail-on "$SECGUARD_FAIL_ON"; then
          echo "verdict=PASS" >> "$GITHUB_OUTPUT"
        else
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "verdict=BLOCK" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
          fi
          exit $status
        fi

    # A gate that found no report has scanned nothing. Reporting that as success
    # makes a misconfigured pipeline indistinguishable from a clean repository,
    # so it fails unless the caller says otherwise in writing.
    - name: Fail when no scanner report was found
      if: steps.collect.outputs.count == '0'
      shell: bash
      env:
        SECGUARD_REPORTS: ${{ inputs.reports }}
        SECGUARD_ALLOW_MISSING: ${{ inputs.allow-missing-reports }}
      run: |
        echo "secguard reads reports and never runs a scanner. Add a detector"
        echo "step that writes one of these paths, or correct the reports input:"
        printf '%s\n' "$SECGUARD_REPORTS"
        if [ "$SECGUARD_ALLOW_MISSING" = "true" ]; then
          echo "::warning title=secguard::No scanner report was found, so nothing was gated."
          exit 0
        fi
        echo "::error title=secguard::No scanner report was found, so nothing was gated."
        exit 1

    # Publishing runs after a completed gate, including BLOCK. It cannot turn
    # a failed gate into a pass; its own failure also fails the Action.
    - name: Publish the compact PR summary
      id: publish
      if: always() && !cancelled() && inputs.publish-pr-comment != 'false'
      shell: bash
      env:
        SECGUARD_ACTION_PATH: ${{ github.action_path }}
        SECGUARD_PUBLISH_COMMENT: ${{ inputs.publish-pr-comment }}
        SECGUARD_COMMENT_FILE: ${{ inputs.comment-output }}
        SECGUARD_EXPECTED_REPOSITORY: ${{ inputs.comment-repository }}
        SECGUARD_COMMENT_MARKER: ${{ inputs.comment-marker }}
        SECGUARD_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        SECGUARD_VERDICT: ${{ steps.gate.outputs.verdict }}
        SECGUARD_REPORTS_FOUND: ${{ steps.collect.outputs.count }}
        SECGUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
        SECGUARD_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SECGUARD_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        SECGUARD_TOKEN: ${{ github.token }}
      run: python -I "$SECGUARD_ACTION_PATH/scripts/post_pr_comment.py"
